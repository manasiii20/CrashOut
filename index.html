<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>CrashOut</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Product+Sans:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Two-column start screen (copy left, frog right); game = one card (HUD + canvas). */
        :root {
            --bg: #0b0b0c;
            --panel: #131315;
            --line: rgba(255, 255, 255, 0.07);
            --line-strong: rgba(255, 255, 255, 0.12);
            --text: #f4f4f5;
            --muted: #a1a1aa;
            --faint: #6b6b74;
            --accent: #c5e886;
            --accent-hover: #d3f09e;
            --danger: #f87171;
            --font-display: "Product Sans", "Google Sans", "Inter", "Segoe UI", system-ui, Arial, sans-serif;
            --font-body: "Inter", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
            --radius: 12px;
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ================= Start screen ================= */
        #startScreen {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            background: var(--bg);
            z-index: 2000;
            overflow-y: auto;
        }
        .start-inner {
            width: 100%;
            max-width: 1040px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            align-items: center;
            gap: 48px;
        }
        .start-content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            animation: fadeIn 0.5s ease-out both;
        }

        #startScreen h1 {
            margin: 0;
            font-family: var(--font-display);
            font-size: 72px;
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1;
        }
        .game-brief {
            margin: 16px 0 0;
            max-width: 460px;
            font-size: 17px;
            line-height: 1.6;
            color: var(--muted);
        }

        .rules {
            margin: 36px 0 0;
            padding: 0;
            width: 100%;
            max-width: 440px;
            display: grid;
            grid-template-columns: 72px 1fr;
            row-gap: 14px;
            font-size: 15px;
            line-height: 1.5;
        }
        .rules dt {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-display);
            font-weight: 700;
            color: var(--text);
        }
        .rules dd {
            margin: 0;
            color: var(--muted);
        }
        .rules .danger { color: var(--danger); }

        .actions {
            margin-top: 40px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        #startButton {
            height: 48px;
            min-width: 160px;
            padding: 0 28px;
            border: none;
            border-radius: var(--radius);
            background: var(--accent);
            color: #0b0b0c;
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        #startButton:hover { background: var(--accent-hover); }
        #startButton:active { transform: translateY(1px); }
        #startButton:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
        .start-hint {
            font-size: 13px;
            color: var(--faint);
        }

        /* Frog: hops up and down on the right */
        .player-preview {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 420px;
        }
        .player-preview img {
            width: 100%;
            max-width: 400px;
            height: auto;
            animation: hop 2.4s ease-in-out infinite;
        }
        .player-preview::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 110px;
            width: 200px;
            height: 16px;
            margin-left: -100px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            filter: blur(8px);
            animation: hopShadow 2.4s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes hop {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-28px); }
        }
        @keyframes hopShadow {
            0%, 100% { transform: scaleX(1); opacity: 1; }
            50% { transform: scaleX(0.75); opacity: 0.5; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: none; }
        }

        @media (max-width: 860px) {
            .start-inner { grid-template-columns: 1fr; gap: 8px; }
            .player-preview { order: -1; height: 240px; }
            .player-preview img { max-width: 280px; }
            .player-preview::after { bottom: 56px; width: 150px; margin-left: -75px; }
            #startScreen { align-items: flex-start; }
            #startScreen h1 { font-size: 56px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .player-preview img, .player-preview::after, .start-content { animation: none; }
        }

        /* ================= Game (HUD + canvas as one card) ================= */
        .game-shell {
            display: flex;
            flex-direction: column;
        }

        #gameStats {
            width: 804px; /* canvas 800px + 2px border each side */
            height: 56px;
            display: flex;
            align-items: center;
            gap: 28px;
            padding: 0 20px;
            background: var(--panel);
            border: 2px solid var(--line);
            border-bottom: none;
            border-radius: 16px 16px 0 0;
            font-size: 14px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .stat-divider { display: none; }
        /* game.js sets the stage colour inline; keep the colour, drop the box */
        .stage {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: var(--font-display);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.06em;
            background: none !important;
            border: none !important;
            padding: 0;
        }
        .stage::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }
        .timer #timer,
        .score #score {
            font-family: var(--font-display);
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
        }
        .health-bar {
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .health-bar-container {
            width: 112px;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            overflow: hidden;
        }
        .health-bar-fill {
            height: 100%;
            border-radius: 999px;
            transition: width 0.3s ease, background-color 0.3s ease;
        }
        .final-sprint {
            color: #fbbf24;
            font-weight: 600;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }

        /* Display size and 2px border match the original so mouse coordinates are unchanged. */
        canvas {
            display: block;
            margin: 0;
            border: 2px solid var(--line);
            border-radius: 0 0 16px 16px;
            cursor: none;
            background:
                radial-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px) 0 0 / 24px 24px,
                #0f0f11;
        }

        /* ================= Loading overlay ================= */
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }
        .loading-container {
            width: 200px;
            text-align: center;
        }
        .loading-text {
            font-family: var(--font-display);
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 14px;
        }
        .loading-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            overflow: hidden;
        }
        .loading-progress {
            width: 0%;
            height: 100%;
            background: var(--accent);
            border-radius: 999px;
            transition: width 0.8s ease-out;
        }
    </style>
</head>
<body>
    <div id="startScreen">
        <div class="start-inner">
            <div class="start-content">
                <h1>CrashOut</h1>
                <p class="game-brief">Clear the screen of blocks before the clock runs out.</p>

                <dl class="rules">
                    <dt>Move</dt>
                    <dd>Your frog follows the mouse.</dd>
                    <dt>Push</dt>
                    <dd>Shove blocks off screen. Quick flicks push harder.</dd>
                    <dt>Dodge</dt>
                    <dd><span class="danger">Red blocks</span> chase you. Fast hits cost health.</dd>
                </dl>

                <div class="actions">
                    <button id="startButton">Play</button>
                    <span class="start-hint">5 stages · Mouse required</span>
                </div>
            </div>
            <div class="player-preview">
                <img src="player.png" alt="Player Avatar">
            </div>
        </div>
    </div>
    <div class="game-shell">
        <div id="gameStats">
            <span class="stage">STAGE 1</span>
            <span class="stat-divider">|</span>
            <span class="timer">Time: <span id="timer">20</span>s</span>
            <span class="stat-divider">|</span>
            <span class="score">Score: <span id="score">0</span></span>
            <span class="stat-divider">|</span>
            <div class="health-bar">
                Health:
                <div class="health-bar-container">
                    <div class="health-bar-fill" style="width: 100%; background: #2ecc71;"></div>
                </div>
            </div>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-container">
            <div class="loading-text">Loading</div>
            <div class="loading-bar">
                <div class="loading-progress" id="loadingProgress"></div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('startButton').addEventListener('click', function(e) {
            e.preventDefault();
            const loadingOverlay = document.getElementById('loadingOverlay');
            const loadingProgress = document.getElementById('loadingProgress');
            const startScreen = document.getElementById('startScreen');

            loadingOverlay.style.display = 'flex';
            
            setTimeout(() => {
                loadingProgress.style.width = '100%';
            }, 100);

            setTimeout(() => {
                loadingOverlay.style.display = 'none';
                startScreen.style.display = 'none';
                initializeGame();
            }, 1000);
        });
    </script>
    <script src="sounds.js"></script>
    <script src="game.js"></script>
    <script src="ui.js"></script>
</body>
</html>
